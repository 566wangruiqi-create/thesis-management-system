<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>用户管理 - 毕业论文管理系统</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-line">
          <span class="brand-mark">毕</span>
          <span>论文管理</span>
        </div>
        <nav id="sidebarNav" class="nav-list" aria-label="主导航"></nav>
      </aside>

      <div class="main-shell">
        <header class="topbar">
          <div id="topbarTitle" class="topbar-title">用户管理</div>
          <div class="user-meta">
            <span id="currentUserAvatar" class="avatar"></span>
            <span id="currentUserName"></span>
            <span id="currentUserRole" class="badge default"></span>
            <button id="logoutBtn" class="btn">退出</button>
          </div>
        </header>

        <main class="content">
          <section class="page-header">
            <div>
              <h1>用户管理</h1>
              <p class="muted">管理员查看教师与学生基础信息。</p>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <h2>教师用户</h2>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>工号</th>
                    <th>姓名</th>
                    <th>学院</th>
                    <th>职称</th>
                    <th>电话</th>
                    <th>邮箱</th>
                  </tr>
                </thead>
                <tbody id="teachersTable"></tbody>
              </table>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <h2>学生用户</h2>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>学号</th>
                    <th>姓名</th>
                    <th>班级</th>
                    <th>专业</th>
                    <th>电话</th>
                    <th>邮箱</th>
                  </tr>
                </thead>
                <tbody id="studentsTable"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="../js/mockData.js"></script>
    <script src="../js/demoApi.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/users.js"></script>
  </body>
</html>
