<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>论文归档 - 毕业论文管理系统</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-line">
          <span class="brand-mark">毕</span>
          <span>论文管理</span>
        </div>
        <nav id="sidebarNav" class="nav-list" aria-label="主导航"></nav>
      </aside>

      <div class="main-shell">
        <header class="topbar">
          <div id="topbarTitle" class="topbar-title">论文归档</div>
          <div class="user-meta">
            <span id="currentUserAvatar" class="avatar"></span>
            <span id="currentUserName"></span>
            <span id="currentUserRole" class="badge default"></span>
            <button id="logoutBtn" class="btn">退出</button>
          </div>
        </header>

        <main class="content">
          <section class="page-header">
            <div>
              <h1>论文归档</h1>
              <p id="archivesSubtitle" class="muted"></p>
            </div>
          </section>

          <section id="archiveFormPanel" class="panel hidden">
            <div class="panel-header">
              <h2>完成归档</h2>
            </div>
            <form id="archiveForm" class="form-grid">
              <div class="three-col">
                <div class="form-row">
                  <label for="archiveStudent">学生</label>
                  <select id="archiveStudent" name="studentId" required></select>
                </div>
                <div class="form-row">
                  <label for="archiveDate">归档日期</label>
                  <input id="archiveDate" name="archiveDate" type="date" required />
                </div>
                <div class="form-row">
                  <label for="archiveLocation">存放位置</label>
                  <input id="archiveLocation" name="location" placeholder="2026届信管论文档案柜 A-01" required />
                </div>
              </div>
              <div class="form-row">
                <label for="archiveNote">备注</label>
                <textarea id="archiveNote" name="note"></textarea>
              </div>
              <div class="form-actions">
                <button class="btn primary" type="submit">保存归档</button>
              </div>
            </form>
          </section>

          <section class="panel">
            <div class="panel-header">
              <h2>归档列表</h2>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>学生</th>
                    <th>课题</th>
                    <th>指导教师</th>
                    <th>归档日期</th>
                    <th>状态</th>
                    <th>存放位置</th>
                    <th>备注</th>
                  </tr>
                </thead>
                <tbody id="archivesTable"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="../js/mockData.js"></script>
    <script src="../js/demoApi.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/archive.js"></script>
  </body>
</html>
